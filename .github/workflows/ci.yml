name: Framework and public data checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate framework and links
        run: python3 scripts/validate_framework.py
      - name: Validate public data
        run: python3 scripts/validate_public_data.py
