name: 五层建设任务
description: 按数据 算法 AIGC 应用 评估登记任务
title: "[层次] 任务名称"
body:
  - type: dropdown
    id: layer
    attributes:
      label: 所属层
      options: [数据层, 算法层, AIGC层, 应用层, 评估层, 报告与管理]
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: 业务问题 输入与输出
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 数据条件与任务依赖
      description: 写明真实 聚合 合成数据及缺口
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准与证据
    validations:
      required: true
